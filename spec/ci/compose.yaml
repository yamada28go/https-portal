# No ports, socket, host bind mounts, external volumes or public CA.
services:
  portal:
    image: ${IT_PORTAL_IMAGE:?Set IT_PORTAL_IMAGE}
    pull_policy: never
    environment:
      STAGE: local
      DOMAINS: ${IT_DOMAINS:-portal.test}
      FORCE_RENEW: "false"
      ACCESS_LOG: stdout
      ERROR_LOG: stderr
    extra_hosts:
      # Avoid default-route discovery on the isolated network.
      dockerhost: "127.0.0.1"
    volumes:
      - certificates:/var/lib/https-portal
      - nginx-logs:/var/log/nginx
      - site:/var/www/vhosts
    networks:
      isolated:
        aliases: [portal.test, proxy.test, auth.test, tls.test, static.test]
  echo:
    image: ${IT_TEST_IMAGE:?Set IT_TEST_IMAGE}
    pull_policy: never
    command: [ruby, /opt/it/echo.rb]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [isolated]
  prepare:
    image: ${IT_TEST_IMAGE:?Set IT_TEST_IMAGE}
    pull_policy: never
    profiles: [test]
    command: [ruby, /opt/it/prepare.rb]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      IT_SCENARIO: ${IT_SCENARIO:-local}
    volumes:
      - certificates:/fixture/certificates
      - site:/fixture/site
      - public:/fixture/public
    networks: [isolated]
  tester:
    image: ${IT_TEST_IMAGE:?Set IT_TEST_IMAGE}
    pull_policy: never
    profiles: [test]
    command: [ruby, /opt/it/probe.rb]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      IT_TARGET_HOST: portal.test
      IT_SCENARIO: ${IT_SCENARIO:-local}
      IT_STARTUP_TIMEOUT_SECONDS: ${IT_STARTUP_TIMEOUT_SECONDS:-180}
    volumes:
      - public:/public
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  certificates:
  nginx-logs:
  site:
  public:
